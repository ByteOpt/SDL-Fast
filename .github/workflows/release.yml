name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.1
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64
      - name: Pack extension
        shell: pwsh
        run: |
          Compress-Archive -Path extension -DestinationPath desktop/dist/SDL-Fast-extension.zip -Force
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            desktop/dist/SDL Fast-setup.exe
            desktop/dist/SDL-Fast-extension.zip
          fail_on_unmatched_files: true
